plugins {
    id 'application'
    alias(libs.plugins.shadow)
}

description = "Headless JSON-RPC server that exposes KeY to automated agents."

dependencies {
    // Deliberately NOT key.ui: the server must stay free of Swing and of KeYMediator's
    // single-"current proof" semantics, which conflict with serving many sessions.
    implementation project(':key.core')

    implementation(libs.jackson.databind)
    implementation(libs.picocli)

    // slf4j needs a binding at runtime, otherwise the shadow jar logs nothing at all.
    // runtimeOnly keeps logback off the compile classpath so no code can depend on it.
    runtimeOnly(libs.logback.classic)
}

application {
    mainClass = "org.key_project.server.Main"
    // for start script generated with createStartScripts
    applicationName = "keyext-server"
}

shadowJar {
    archiveClassifier = "exe"
    archiveBaseName = "keyext.server"
}

// The SMT degradation test sabotages SolverTypes, whose SolverType objects are process-wide
// singletons: once a solver is pointed at a path that cannot be executed, it stays pointed there
// for the rest of the JVM. Running it in its own forked task keeps that out of every other test.
def smtDegradationTest = tasks.register("smtDegradationTest", Test) {
    description = "Runs the SMT degradation test in a JVM of its own."
    group = "verification"
    filter {
        includeTestsMatching "org.key_project.server.Smt*Test"
    }
    forkEvery = 1
}

tasks.named("test") {
    filter {
        excludeTestsMatching "org.key_project.server.Smt*Test"
    }
    // CI invokes ":keyext.server:test" directly, so the degradation test has to hang off that
    // task to run at all.
    dependsOn smtDegradationTest
}

// Instances publish a record under the user's XDG state directory. Left alone, running the tests
// would scatter files through the developer's own ~/.local/state, so both test tasks are pointed
// at the build directory instead.
tasks.withType(Test).configureEach {
    environment "XDG_STATE_HOME", layout.buildDirectory.dir("xdg-state").get().asFile.absolutePath
}
