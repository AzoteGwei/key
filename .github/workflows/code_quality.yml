name: CodeQuality
# Disabled on the azote/keyext-server branch: this branch releases through
# .github/workflows/release.yml alone. Restore the triggers below before merging into main.
on:
  workflow_dispatch:
  # merge_group, pull_request and push (main / KeY-*) removed.

jobs:
  checkerFramework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          java-version: 21
          distribution: 'corretto'
          cache: 'gradle'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: ./gradlew -DENABLE_NULLNESS=true compileTestJava

  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: 'gradle'
      - name: Build with Gradle
        run: ./gradlew --parallel --continue spotlessCheck
